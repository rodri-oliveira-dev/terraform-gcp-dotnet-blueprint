name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment root to apply
        required: true
        type: choice
        options:
          - dev
          - prod
      confirmation:
        description: Type apply-dev or apply-prod to confirm the selected environment
        required: true
        type: string
      allow_destroy:
        description: Allow plans containing delete or replacement actions
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  APPLY_CONFIRMATION: ${{ inputs.confirmation }}
  ALLOW_DESTROY: ${{ inputs.allow_destroy }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  GCP_TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
  GCP_DEV_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
  GCP_PROD_PROJECT_ID: ${{ vars.GCP_PROD_PROJECT_ID }}
  TF_DEV_API_IMAGE: ${{ vars.TF_DEV_API_IMAGE }}
  TF_DEV_WORKER_IMAGE: ${{ vars.TF_DEV_WORKER_IMAGE }}
  TF_DEV_BATCH_IMAGE: ${{ vars.TF_DEV_BATCH_IMAGE }}
  TF_DEV_ENABLE_WORKLOADS: ${{ vars.TF_DEV_ENABLE_WORKLOADS }}
  TF_PROD_API_IMAGE: ${{ vars.TF_PROD_API_IMAGE }}
  TF_PROD_WORKER_IMAGE: ${{ vars.TF_PROD_WORKER_IMAGE }}
  TF_PROD_BATCH_IMAGE: ${{ vars.TF_PROD_BATCH_IMAGE }}
  TF_PROD_ENABLE_WORKLOADS: ${{ vars.TF_PROD_ENABLE_WORKLOADS }}

jobs:
  plan:
    name: Review plan for ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.summary.outputs.plan_sha256 }}
      has_changes: ${{ steps.summary.outputs.has_changes }}
      has_destroy: ${{ steps.summary.outputs.has_destroy }}
    steps:
      - name: Validate manual deployment request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Terraform apply must be dispatched from refs/heads/main."
            exit 1
          fi

          expected="apply-${TARGET_ENVIRONMENT}"
          if [[ "$APPLY_CONFIRMATION" != "$expected" ]]; then
            echo "::error::Confirmation must be exactly ${expected}."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select environment configuration
        shell: bash
        run: bash .github/scripts/terraform-deployment-env.sh

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Initialize remote backend
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" init \
            -input=false \
            -lockfile=readonly \
            -reconfigure \
            -backend-config="bucket=$GCP_TERRAFORM_STATE_BUCKET" \
            -no-color

      - name: Create pre-approval plan
        id: summary
        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.tfplan"
          plan_log="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.plan.log"

          set +e
          terraform -chdir="$TF_ROOT" plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -detailed-exitcode \
            -out="$plan_file" >"$plan_log" 2>&1
          status=$?
          set -e

          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "::error::Terraform plan failed. Full plan output is intentionally withheld from logs because it can contain state-derived sensitive data."
            exit "$status"
          fi

          bash .github/scripts/terraform-plan-summary.sh \
            "$plan_file" \
            "Pre-approval Terraform plan — ${TARGET_ENVIRONMENT}"

      - name: Reject unapproved destructive changes
        env:
          HAS_DESTROY: ${{ steps.summary.outputs.has_destroy }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_DESTROY" == "true" && "$ALLOW_DESTROY" != "true" ]]; then
            echo "::error::The plan contains delete or replacement actions. Re-dispatch with allow_destroy=true only after reviewing those actions."
            exit 1
          fi

  apply:
    name: Apply ${{ inputs.environment }}
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select environment configuration
        shell: bash
        run: bash .github/scripts/terraform-deployment-env.sh

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Initialize remote backend
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" init \
            -input=false \
            -lockfile=readonly \
            -reconfigure \
            -backend-config="bucket=$GCP_TERRAFORM_STATE_BUCKET" \
            -no-color

      - name: Recreate approved plan
        id: summary
        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.tfplan"
          plan_log="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.plan.log"
          echo "PLAN_FILE=$plan_file" >> "$GITHUB_ENV"

          set +e
          terraform -chdir="$TF_ROOT" plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -detailed-exitcode \
            -out="$plan_file" >"$plan_log" 2>&1
          status=$?
          set -e

          if [[ "$status" == "0" ]]; then
            echo "::error::The approved plan no longer contains changes. Re-dispatch rather than applying a stale approval."
            exit 1
          fi

          if [[ "$status" != "2" ]]; then
            echo "::error::Terraform re-plan failed. Full plan output is intentionally withheld from logs because it can contain state-derived sensitive data."
            exit "$status"
          fi

          bash .github/scripts/terraform-plan-summary.sh \
            "$plan_file" \
            "Apply-time Terraform plan — ${TARGET_ENVIRONMENT}"

      - name: Verify plan fingerprint and destruction policy
        env:
          ACTUAL_PLAN_SHA256: ${{ steps.summary.outputs.plan_sha256 }}
          HAS_DESTROY: ${{ steps.summary.outputs.has_destroy }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTUAL_PLAN_SHA256" != "$EXPECTED_PLAN_SHA256" ]]; then
            echo "::error::The Terraform plan changed after the pre-approval plan. Nothing was applied; dispatch a new run and review the new plan."
            exit 1
          fi

          if [[ "$HAS_DESTROY" == "true" && "$ALLOW_DESTROY" != "true" ]]; then
            echo "::error::The apply-time plan contains delete or replacement actions without allow_destroy=true."
            exit 1
          fi

      - name: Apply approved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" apply \
            -input=false \
            -no-color \
            "$PLAN_FILE"

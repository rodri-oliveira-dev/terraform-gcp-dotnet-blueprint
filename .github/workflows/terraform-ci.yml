name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  format:
    name: Terraform format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: Terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Initialize and validate Terraform roots and modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t roots < <(
            for base in bootstrap environments examples; do
              [[ -d "$base" ]] || continue
              find "$base" -mindepth 2 -maxdepth 2 -type f -name '*.tf' -printf '%h\n'
            done | sort -u
          )

          if (( ${#roots[@]} == 0 )); then
            echo "::error::No Terraform roots were found under bootstrap/, environments/, or examples/."
            exit 1
          fi

          for root in "${roots[@]}"; do
            echo "::group::Validate root ${root}"

            if [[ ! -f "${root}/.terraform.lock.hcl" ]]; then
              echo "::error file=${root}/.terraform.lock.hcl::Terraform roots must commit a dependency lock file."
              exit 1
            fi

            terraform -chdir="$root" init \
              -backend=false \
              -input=false \
              -lockfile=readonly \
              -no-color
            terraform -chdir="$root" validate -no-color

            echo "::endgroup::"
          done

          mapfile -t modules < <(
            if [[ -d modules ]]; then
              find modules -mindepth 2 -maxdepth 2 -type f -name '*.tf' -printf '%h\n' | sort -u
            fi
          )

          for module in "${modules[@]}"; do
            echo "::group::Validate reusable module ${module}"

            terraform -chdir="$module" init \
              -backend=false \
              -input=false \
              -no-color
            terraform -chdir="$module" validate -no-color

            echo "::endgroup::"
          done

  test:
    name: Terraform test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Run reusable module tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tested_modules < <(
            if [[ -d modules ]]; then
              find modules -mindepth 3 -maxdepth 3 -type f -name '*.tftest.hcl' -print \
                | sed -E 's#/tests/[^/]+$##' \
                | sort -u
            fi
          )

          if (( ${#tested_modules[@]} == 0 )); then
            echo "No reusable module tests were found."
            exit 0
          fi

          for module in "${tested_modules[@]}"; do
            echo "::group::Test reusable module ${module}"

            terraform -chdir="$module" init \
              -backend=false \
              -input=false \
              -no-color
            terraform -chdir="$module" test -no-color

            echo "::endgroup::"
          done

  lint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version_file: .tflint-version
          cache: true

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --format compact

  security:
    name: IaC security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

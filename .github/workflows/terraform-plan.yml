name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment root to plan
        required: true
        type: choice
        options:
          - dev
          - prod

permissions: {}

concurrency:
  group: terraform-plan-${{ inputs.environment }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  GCP_TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
  GCP_DEV_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
  GCP_PROD_PROJECT_ID: ${{ vars.GCP_PROD_PROJECT_ID }}
  TF_DEV_API_IMAGE: ${{ vars.TF_DEV_API_IMAGE }}
  TF_DEV_WORKER_IMAGE: ${{ vars.TF_DEV_WORKER_IMAGE }}
  TF_DEV_BATCH_IMAGE: ${{ vars.TF_DEV_BATCH_IMAGE }}
  TF_DEV_ENABLE_WORKLOADS: ${{ vars.TF_DEV_ENABLE_WORKLOADS }}
  TF_PROD_API_IMAGE: ${{ vars.TF_PROD_API_IMAGE }}
  TF_PROD_WORKER_IMAGE: ${{ vars.TF_PROD_WORKER_IMAGE }}
  TF_PROD_BATCH_IMAGE: ${{ vars.TF_PROD_BATCH_IMAGE }}
  TF_PROD_ENABLE_WORKLOADS: ${{ vars.TF_PROD_ENABLE_WORKLOADS }}

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main branch execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Credentialed Terraform plans must be dispatched from refs/heads/main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select environment configuration
        shell: bash
        run: bash .github/scripts/terraform-deployment-env.sh

      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Initialize remote backend
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_ROOT" init \
            -input=false \
            -lockfile=readonly \
            -reconfigure \
            -backend-config="bucket=$GCP_TERRAFORM_STATE_BUCKET" \
            -no-color

      - name: Create reviewable plan
        id: summary
        shell: bash
        run: |
          set -euo pipefail

          plan_file="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.tfplan"
          plan_log="$RUNNER_TEMP/terraform-${TARGET_ENVIRONMENT}.plan.log"

          set +e
          terraform -chdir="$TF_ROOT" plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -detailed-exitcode \
            -out="$plan_file" >"$plan_log" 2>&1
          status=$?
          set -e

          if [[ "$status" != "0" && "$status" != "2" ]]; then
            echo "::error::Terraform plan failed. Full plan output is intentionally withheld from logs because it can contain state-derived sensitive data."
            exit "$status"
          fi

          bash .github/scripts/terraform-plan-summary.sh \
            "$plan_file" \
            "Terraform plan — ${TARGET_ENVIRONMENT}"
